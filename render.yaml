# Render Blueprint — deploys the whole FLAME platform for free:
#   1) PostgreSQL database (free)
#   2) Node/Express API (free web service)
#   3) React client as a static site (free)
#
# How to use:
#   - Push this repo to GitHub (already done: github.com/mina2508/flame-platform)
#   - On render.com → New → Blueprint → pick this repo → Apply
#   - Render reads this file and creates all three services.
#
# After the first deploy, copy the client's URL and the API's URL and set the
# two "sync: false" env vars (VITE_API_BASE_URL on the web, CORS_ORIGIN on the API).

databases:
  - name: flame-db
    plan: free
    databaseName: flame
    user: flame

services:
  # ---------- API (Node/Express + Prisma) ----------
  - type: web
    name: flame-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flame-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false   # set to the client URL after first deploy, e.g. https://flame-web.onrender.com

  # ---------- Client (React static site) ----------
  - type: web
    name: flame-web
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false   # set to the API URL after first deploy, e.g. https://flame-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
