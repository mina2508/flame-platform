# Render Blueprint (OPTIONAL) — API + static web only.
# No Render database here (to avoid the card requirement). Use a free Neon
# Postgres instead and paste its connection string into DATABASE_URL below
# (or set it in the Render dashboard).
#
# You can also skip this file entirely and create the two services manually
# in the Render dashboard — see DEPLOY.md.

services:
  # ---------- API (Node/Express + Prisma) ----------
  - type: web
    name: flame-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false   # paste your Neon connection string (postgresql://...)
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false   # set to the client URL after first deploy

  # ---------- Client (React static site) ----------
  - type: web
    name: flame-web
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false   # set to the API URL after first deploy
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
